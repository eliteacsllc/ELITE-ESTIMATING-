name: Cross-platform readiness
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('cross-platform.manifest.json').read_text())
          assert d.get('schemaVersion') == 3
          required={'web','pwa','android','ios','macos','windows','linux'}
          assert required <= set(d.get('targets',{}))
          impl=d.get('implementation',{})
          assert impl.get('secureStorage') == 'required'
          assert impl.get('buildEvidence') == 'required-before-supported'
          print('cross-platform contract: OK')
          PY
