name: Cloudflare Portfolio Preflight

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: cloudflare-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable pin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # immutable pin
        with:
          node-version: '22'
      - name: Run non-destructive Cloudflare preflight
        run: node scripts/portfolio-cloudflare-preflight.mjs
