name: Roll Back Elite Estimating Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Known-good 40-character commit SHA to restore
        required: true
        type: string
      production_url:
        description: Public production base URL
        required: true
        type: string
      database_compatibility:
        description: Type DB-COMPATIBLE after confirming the target commit supports the current production schema
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to authorize the production rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: elite-estimating-production
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirmation == 'ROLLBACK' && inputs.database_compatibility == 'DB-COMPATIBLE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ELITE_AUTH_SECRET: ${{ secrets.ELITE_AUTH_SECRET }}
      TARGET_SHA: ${{ inputs.git_ref }}
      PRODUCTION_URL: ${{ inputs.production_url }}

    steps:
      - name: Validate rollback inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo 'git_ref must be an immutable 40-character commit SHA' >&2
            exit 1
          fi
          case "$PRODUCTION_URL" in
            https://*) ;;
            *) echo 'production_url must use HTTPS' >&2; exit 1 ;;
          esac
          node -e "const u=new URL(process.env.PRODUCTION_URL); if(u.username||u.password||u.search||u.hash) process.exit(1); if(u.pathname!=='/'&&u.pathname!=='') process.exit(1);" || {
            echo 'production_url must be a clean HTTPS origin with no credentials, query, fragment, or path' >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#ELITE_AUTH_SECRET}" -ge 32

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify selected source revision
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected=$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          echo "Restoring immutable source revision: $actual"
          test -f Dockerfile
          test -f deploy/cloudflare/wrangler.jsonc
          test -f deploy/cloudflare/src/index.ts

      - name: Re-run application verification at target revision
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run verify
          npm audit --omit=dev --audit-level=high

      - name: Re-run Cloudflare adapter typecheck
        working-directory: deploy/cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Build target production container locally
        run: docker build -t elite-estimating:rollback-candidate .

      - name: Redeploy target Worker and container image
        working-directory: deploy/cloudflare
        run: npx wrangler deploy --config wrangler.jsonc --containers-rollout=immediate

      - name: Verify restored public readiness
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output /tmp/elite-ready.json --write-out '%{http_code}' "$base/ready" || true)
            if [ "$code" = '200' ] && grep -q '"status":"ready"' /tmp/elite-ready.json \
              && grep -q '"rateLimitDurable":true' /tmp/elite-ready.json \
              && grep -q '"rateLimitHealthy":true' /tmp/elite-ready.json; then
              cat /tmp/elite-ready.json
              exit 0
            fi
            sleep 5
          done
          echo 'Rollback readiness verification failed.' >&2
          cat /tmp/elite-ready.json 2>/dev/null || true
          exit 1

      - name: Verify authenticated rollback lifecycle
        shell: bash
        run: |
          node <<'NODE'
          const { createHmac, randomUUID } = require('node:crypto');
          const assert = require('node:assert/strict');
          const secret = process.env.ELITE_AUTH_SECRET;
          const base = process.env.PRODUCTION_URL.replace(/\/$/, '');
          const runId = randomUUID();
          const header = Buffer.from(JSON.stringify({ alg: 'HS256', typ: 'JWT' })).toString('base64url');
          const payload = Buffer.from(JSON.stringify({ userId: 'rollback-smoke', tenantId: 'rollback-smoke', roles: ['tenant_admin'], exp: Math.floor(Date.now()/1000)+300 })).toString('base64url');
          const input = `${header}.${payload}`;
          const signature = createHmac('sha256', secret).update(input).digest('base64url');
          const token = `${input}.${signature}`;
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json', 'idempotency-key': `rollback-smoke-${runId}` };
          const body = JSON.stringify({ claimId: `rollback-smoke-${runId}`, asset: { assetClass: 'passenger_vehicle', vin: '1HGCM82633A004352' }, locale: 'en-US', currency: 'USD', jurisdiction: 'US' });
          const create = await fetch(`${base}/v1/estimates`, { method: 'POST', headers, body });
          const createText = await create.text();
          assert.equal(create.status, 201, createText);
          const estimate = JSON.parse(createText);
          assert.ok(estimate.id);
          const read = await fetch(`${base}/v1/estimates/${estimate.id}`, { headers: { authorization: `Bearer ${token}` } });
          assert.equal(read.status, 200, await read.text());
          const voided = await fetch(`${base}/v1/estimates/${estimate.id}/void`, { method: 'POST', headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' } });
          const voidText = await voided.text();
          assert.equal(voided.status, 200, voidText);
          assert.equal(JSON.parse(voidText).status, 'voided');
          console.log('authenticated rollback lifecycle smoke passed');
          NODE
