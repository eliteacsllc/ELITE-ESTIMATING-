name: Hybrid Compute Profile
on:
  push:
    paths: ['.elite/hybrid-compute.json','.elite/validate-hybrid-compute.mjs','.github/workflows/hybrid-compute-profile.yml']
  pull_request:
    paths: ['.elite/hybrid-compute.json','.elite/validate-hybrid-compute.mjs','.github/workflows/hybrid-compute-profile.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '20'}
      - run: node .elite/validate-hybrid-compute.mjs
