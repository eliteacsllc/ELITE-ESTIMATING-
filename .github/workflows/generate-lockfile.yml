name: Generate deterministic npm lockfiles

on:
  push:
    branches: [hardening/reproducible-builds]
    paths:
      - package.json
      - deploy/cloudflare/package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/reproducible-builds
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix deploy/cloudflare install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfiles exist
        run: |
          test -s package-lock.json
          test -s deploy/cloudflare/package-lock.json
      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json deploy/cloudflare/package-lock.json
          if git diff --cached --quiet; then
            echo 'lockfiles already current'
            exit 0
          fi
          git commit -m 'Lock application and adapter dependencies'
          git push origin HEAD:hardening/reproducible-builds
