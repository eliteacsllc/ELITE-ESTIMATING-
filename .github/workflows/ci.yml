name: Elite Estimating CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: elite-estimating-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://elite:elite@127.0.0.1:5432/elite_estimating
      ELITE_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      PORT: 8787
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elite
          POSTGRES_PASSWORD: elite
          POSTGRES_DB: elite_estimating
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U elite -d elite_estimating"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - name: Run database migrations
        run: npm run migrate
      - name: Smoke atomic supplement approval transaction
        run: npm run smoke:postgres:transactions
      - name: Smoke primary database schema integrity
        run: npm run smoke:postgres:schema
      - name: Verify PostgreSQL backup and restore
        run: |
          docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U elite -d elite_estimating -Fc > /tmp/elite-estimating.dump
          test -s /tmp/elite-estimating.dump
          docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            psql -h 127.0.0.1 -U elite -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS elite_estimating_restore;' \
            -c 'CREATE DATABASE elite_estimating_restore;'
          cat /tmp/elite-estimating.dump | docker run --rm -i --network host -e PGPASSWORD=elite postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U elite -d elite_estimating_restore --no-owner --no-privileges --exit-on-error
          DATABASE_URL=postgresql://elite:elite@127.0.0.1:5432/elite_estimating_restore npm run smoke:postgres:schema
          PRIMARY_ESTIMATES=$(docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            psql -h 127.0.0.1 -U elite -d elite_estimating -Atc 'SELECT COUNT(*) FROM estimates;')
          RESTORED_ESTIMATES=$(docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            psql -h 127.0.0.1 -U elite -d elite_estimating_restore -Atc 'SELECT COUNT(*) FROM estimates;')
          PRIMARY_SUPPLEMENTS=$(docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            psql -h 127.0.0.1 -U elite -d elite_estimating -Atc 'SELECT COUNT(*) FROM supplements;')
          RESTORED_SUPPLEMENTS=$(docker run --rm --network host -e PGPASSWORD=elite postgres:16-alpine \
            psql -h 127.0.0.1 -U elite -d elite_estimating_restore -Atc 'SELECT COUNT(*) FROM supplements;')
          test "$PRIMARY_ESTIMATES" = "$RESTORED_ESTIMATES"
          test "$PRIMARY_SUPPLEMENTS" = "$RESTORED_SUPPLEMENTS"
          test "$RESTORED_ESTIMATES" -gt 0
          test "$RESTORED_SUPPLEMENTS" -gt 0
      - name: Smoke production server and HTTP mutation idempotency
        run: |
          node dist/api/server.js > /tmp/elite-estimating.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/elite-estimating.log' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ready > /tmp/ready.json; then break; fi
            sleep 1
          done
          cat /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          curl --fail --silent http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          npm run smoke:http
      - name: Build production container
        run: docker build -t elite-estimating:ci .
