name: Cloudflare Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wrangler.toml'
      - 'wrangler.json'
      - 'wrangler.jsonc'
      - 'src/**'
      - 'worker/**'
      - 'workers/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect Cloudflare deployment
        id: cf
        shell: bash
        run: |
          if [[ -f wrangler.toml || -f wrangler.json || -f wrangler.jsonc ]]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.cf.outputs.enabled == 'true' && hashFiles('bun.lock', 'bun.lockb') != '' }}
      - name: Install dependencies from committed lockfile
        if: steps.cf.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            echo 'No supported committed lockfile found; skipping dependency install.'
          fi
      - name: Validate Worker bundle without deploying
        if: steps.cf.outputs.enabled == 'true'
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Record non-Cloudflare repo
        if: steps.cf.outputs.enabled != 'true'
        run: echo 'No root Wrangler config; Cloudflare deployment dry-run is not applicable.'
