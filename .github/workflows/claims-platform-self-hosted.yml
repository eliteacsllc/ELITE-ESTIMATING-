name: Claims Platform Self-Hosted Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claims-platform-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify claims-platform candidate
        run: npm run verify
      - name: Assert clean tracked worktree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            echo "Verification mutated tracked repository files."
            exit 1
          fi
