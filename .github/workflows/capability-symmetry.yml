name: Capability Symmetry
on: {push: {branches: [main]}, pull_request: {}}
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22}
      - run: |
          node --input-type=module <<'NODE'
          import fs from'node:fs';const m=JSON.parse(fs.readFileSync('.elite/capability-symmetry.json'));if(!m.standaloneRequired||!m.presentationBoundaryRequired||!m.optionalEliteIntegrationsOnly||m.essentialCapabilities?.some(c=>c.local!==true))throw new Error('symmetry violation');const{presentForVisibility,assertCustomerSafe}=await import('./src/presentation-boundary.mjs');const x={publicStatus:'in_progress',result:{ok:true,internal:{agents:['a']}},agents:['a'],providers:['p'],providerScoring:'hidden',internalCosts:1};const c=presentForVisibility(x);assertCustomerSafe(c);if(JSON.stringify(c).includes('hidden')||c.agents||c.providers)throw new Error('visibility leak');if(!presentForVisibility(x,'admin').agents)throw new Error('admin visibility broken');console.log('verified',m.product);
          NODE
