name: Elite Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Portfolio security enforcement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,subprocess,sys
          skip={'.git','node_modules','dist','build','.next','coverage','vendor','.venv','venv'}
          pats=[re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),re.compile(r'AKIA[0-9A-Z]{16}'),re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),re.compile(r'(?:sk|rk)_live_[A-Za-z0-9]{16,}'),re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}')]
          lit=re.compile(r'(?im)^\s*[A-Z0-9_.-]*(?:API[_-]?KEY|SECRET|PASSWORD|TOKEN|CLIENT[_-]?SECRET)[A-Z0-9_.-]*\s*[:=]\s*["\']?([^\s,"\']{12,})')
          ph=('example','sample','placeholder','replace-me','replace_with','changeme','dummy','test-only','ci-only','your-','xxxx')
          dyn=('env.','process.env.','secrets.','vars.','github.','os.environ','getenv(','secretref:','vault:')
          bad=[]
          for p in pathlib.Path('.').rglob('*'):
            if not p.is_file() or any(x in skip for x in p.parts):continue
            try:t=p.read_text(errors='ignore')
            except Exception:continue
            if any(r.search(t) for r in pats):bad.append(f'{p}: high-risk secret signature')
            if not any(x in str(p).lower() for x in ('example','sample','fixture','test','readme','security.md')):
              for m in lit.finditer(t):
                v=m.group(1).strip().lower()
                if v.startswith(dyn):continue
                if not any(x in v for x in ph):bad.append(f'{p}: embedded credential-like literal')
          forbidden=re.compile(r'(^|/)(\.env($|\.)|\.dev\.vars($|\.)|credentials\.json$|service-account.*\.json$|id_(rsa|ed25519)$|.*\.(pem|key|p12|pfx|jks|keystore|mobileprovision|tfstate|dump|sqlite|db|bak)$)',re.I)
          for f in subprocess.check_output(['git','ls-files'],text=True).splitlines():
            if forbidden.search(f) and not re.search(r'\.env\.(example|sample)$',f,re.I):bad.append(f'{f}: forbidden secret/data artifact')
          for wf in pathlib.Path('.github/workflows').glob('*.y*ml'):
            t=wf.read_text(errors='ignore')
            if re.search(r'(?m)^\s*pull_request_target\s*:',t):bad.append(f'{wf}: pull_request_target forbidden')
            if re.search(r'(?m)^\s*permissions\s*:\s*write-all\s*$',t):bad.append(f'{wf}: write-all forbidden')
            if re.search(r'persist-credentials\s*:\s*true',t,re.I):bad.append(f'{wf}: persisted credentials forbidden')
            if re.search(r'curl\b[^\n]*\|\s*(?:ba)?sh\b',t,re.I):bad.append(f'{wf}: pipe-to-shell forbidden')
            for line in t.splitlines():
              m=re.search(r'\buses:\s*([^\s#]+)',line)
              if m:
                ref=m.group(1)
                if not ref.startswith('./') and not ref.startswith('docker://') and ('@' not in ref or not re.fullmatch(r'[0-9a-fA-F]{40}',ref.rsplit('@',1)[1])):bad.append(f'{wf}: unpinned action {ref}')
          hp=r'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|(sk|rk)_live_[A-Za-z0-9]{16,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          for c in subprocess.check_output(['git','rev-list','--all','--max-count=500'],text=True).splitlines():
            if subprocess.run(['git','grep','-I','-n','-E',hp,c],capture_output=True).returncode==0:
              bad.append(f'history: secret signature in {c[:12]}');break
          if bad:
            print('SECURITY GATE FAILED');print('\n'.join(sorted(set(bad))));sys.exit(1)
          print('Security gate passed.')
          PY
