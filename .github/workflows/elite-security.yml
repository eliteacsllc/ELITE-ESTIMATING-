name: Elite Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect committed secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          patterns = {
            'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
            'aws_access_key': re.compile(r'AKIA[0-9A-Z]{16}'),
            'github_token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{30,}'),
            'stripe_live_key': re.compile(r'(?:sk|rk)_live_[A-Za-z0-9]{16,}'),
            'slack_token': re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'),
          }
          skip = {'.git', 'node_modules', 'dist', 'build', '.next', 'coverage'}
          findings=[]
          for p in pathlib.Path('.').rglob('*'):
            if not p.is_file() or any(part in skip for part in p.parts):
              continue
            try:
              text=p.read_text(errors='ignore')
            except Exception:
              continue
            for name, rx in patterns.items():
              if rx.search(text): findings.append(f'{p}: {name}')
          if findings:
            print('Potential secrets detected:')
            print('\n'.join(findings))
            sys.exit(1)
          print('No known high-risk secret patterns detected.')
          PY
      - name: Block forbidden secret-bearing filenames
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.dev\.vars($|\.)|credentials\.json$|service-account.*\.json$|.*\.(pem|p12|pfx|jks|keystore)$)' | grep -Ev '(^|/)\.env\.(example|sample)$' || true)
          if [ -n "$bad" ]; then
            echo 'Forbidden secret-bearing files are tracked:'
            echo "$bad"
            exit 1
          fi
          echo 'No forbidden secret-bearing filenames are tracked.'
