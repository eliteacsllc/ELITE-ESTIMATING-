name: Refresh adapter lockfile

on:
  push:
    branches: [hardening/release-provenance]
    paths:
      - deploy/cloudflare/package.json
      - .github/workflows/refresh-adapter-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/release-provenance
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate adapter lockfile
        run: npm --prefix deploy/cloudflare install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git add deploy/cloudflare/package-lock.json
          if git diff --cached --quiet; then
            echo 'adapter lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock Cloudflare adapter package version'
          git push origin HEAD:hardening/release-provenance
