name: Self-hosted release verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-hosted-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS, repo-forge]
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          command -v git
          command -v python3
          command -v node
          command -v npm
          command -v docker
          docker info >/dev/null
          git status --porcelain
      - name: Run canonical repository release gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -x scripts/repo-forge-local.sh ]; then
            bash scripts/repo-forge-local.sh
          elif [ -f package.json ] && node -e 'const p=require("./package.json"); process.exit(p.scripts?.["verify:release"] ? 0 : 1)'; then
            npm run verify:release
          elif [ -f package.json ] && node -e 'const p=require("./package.json"); process.exit(p.scripts?.check ? 0 : 1)'; then
            npm run check
          elif [ -f package.json ] && node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)'; then
            npm test
          elif [ -f pytest.ini ] || [ -f pyproject.toml ] || [ -d tests ]; then
            python3 -m pytest -q
          else
            echo 'No canonical verification entrypoint was detected. Refusing to pass.' >&2
            exit 1
          fi
      - name: Reject dirty verification side effects
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo 'Verification modified the checked-out candidate; release evidence is not reproducible.' >&2
            exit 1
          fi
