[package]
name = "elite-estimating"
version = "0.5.8"
description = "Elite Estimating desktop shell"
authors = ["Elite ACS LLC"]
edition = "2021"

[lib]
name = "elite_estimating_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
