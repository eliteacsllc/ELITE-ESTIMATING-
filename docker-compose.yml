services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: elite_estimating
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_estimating"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - elite_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elite:${POSTGRES_PASSWORD}@postgres:5432/elite_estimating
    command: ["node", "dist/persistence/migrate.js"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://elite:${POSTGRES_PASSWORD}@postgres:5432/elite_estimating
      ELITE_AUTH_SECRET: ${ELITE_AUTH_SECRET:?set ELITE_AUTH_SECRET}
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/ready | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  elite_postgres:
